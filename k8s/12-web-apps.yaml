# ------------------------------------------------------------------------------
# 1. Partner Platform (Hospital Operations & Doctor Clinical Workspace)
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docsearch-partner-platform
  namespace: docsearch-production
  labels:
    app.kubernetes.io/name: partner-platform
    app.kubernetes.io/part-of: docsearch
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: partner-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: partner-platform
        app.kubernetes.io/part-of: docsearch
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: docsearch-web-sa
      securityContext:
        runAsNonRoot: false # NGINX Alpine master process requires root to bind port 80, drops to nginx user
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: partner-platform
          image: docsearch/partner-platform:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: docsearch-partner-platform-svc
  namespace: docsearch-production
  labels:
    app.kubernetes.io/name: partner-platform
    app.kubernetes.io/part-of: docsearch
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: partner-platform
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
