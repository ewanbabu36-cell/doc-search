# ==============================================================================
# DocSearch Persistent Storage Architecture Specification
# ==============================================================================
# 1. Primary Workload Storage: Dedicated AWS EBS gp3 (ReadWriteOnce)
# Used by docsearch-pacs-server in Active-Passive mode (replicas: 1).
# Offers guaranteed 3000 IOPS and 125 MB/s throughput with KMS AES-256 encryption.
# ==============================================================================
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: docsearch-pacs-gp3
  labels:
    app.kubernetes.io/name: pacs-server
    app.kubernetes.io/part-of: docsearch
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  type: gp3
  iops: "3000"
  throughput: "125"
  encrypted: "true"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: docsearch-pacs-pvc
  namespace: docsearch-production
  labels:
    app.kubernetes.io/name: pacs-server
    app.kubernetes.io/part-of: docsearch
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: docsearch-pacs-gp3
  resources:
    requests:
      storage: 100Gi
---
# ==============================================================================
# 2. Multi-Replica Horizontal Scaling Profile: AWS EFS (ReadWriteMany)
# Pre-configured specification for clusters requiring multi-AZ shared PACS storage.
# ==============================================================================
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: docsearch-pacs-efs
  labels:
    app.kubernetes.io/name: pacs-server
    app.kubernetes.io/part-of: docsearch
provisioner: efs.csi.aws.com
volumeBindingMode: Immediate
parameters:
  provisioningMode: efs-ap
  fileSystemId: fs-docsearch-pacs-placeholder # Overridden by Terraform output
  directoryPerms: "700"
  gidRangeStart: "1001"
  gidRangeEnd: "2000"
  basePath: "/pacs-storage"
