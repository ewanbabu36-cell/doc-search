apiVersion: v1
kind: ServiceAccount
metadata:
  name: docsearch-api-gateway-sa
  namespace: docsearch-production
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: docsearch
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: docsearch-pacs-sa
  namespace: docsearch-production
  labels:
    app.kubernetes.io/name: pacs-server
    app.kubernetes.io/part-of: docsearch
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: docsearch-web-sa
  namespace: docsearch-production
  labels:
    app.kubernetes.io/name: web-apps
    app.kubernetes.io/part-of: docsearch
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: docsearch-workload-role
  namespace: docsearch-production
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: docsearch-api-gateway-rb
  namespace: docsearch-production
subjects:
  - kind: ServiceAccount
    name: docsearch-api-gateway-sa
    namespace: docsearch-production
roleRef:
  kind: Role
  name: docsearch-workload-role
  apiGroup: rbac.authorization.k8s.io
