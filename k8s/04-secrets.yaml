# ------------------------------------------------------------------------------
# 1. External Secrets Operator (ESO) Integration Specification
# Fetches encrypted credentials dynamically from AWS Secrets Manager (ap-south-1)
# ------------------------------------------------------------------------------
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: docsearch-aws-secretsmanager
  namespace: docsearch-production
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: docsearch-api-gateway-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: docsearch-api-gateway-externalsecret
  namespace: docsearch-production
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: docsearch-aws-secretsmanager
    kind: SecretStore
  target:
    name: docsearch-api-gateway-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: docsearch/production/database/credentials
        property: DATABASE_URL
    - secretKey: REDIS_URL
      remoteRef:
        key: docsearch/production/redis/credentials
        property: REDIS_URL
    - secretKey: JWT_SECRET
      remoteRef:
        key: docsearch/production/api-gateway/jwt
        property: JWT_SECRET
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: docsearch/production/api-gateway/crypto
        property: ENCRYPTION_KEY
    - secretKey: RAZORPAY_KEY_ID
      remoteRef:
        key: docsearch/production/payments/razorpay
        property: KEY_ID
    - secretKey: RAZORPAY_KEY_SECRET
      remoteRef:
        key: docsearch/production/payments/razorpay
        property: KEY_SECRET
    - secretKey: RAZORPAY_WEBHOOK_SECRET
      remoteRef:
        key: docsearch/production/payments/razorpay
        property: WEBHOOK_SECRET
    - secretKey: ABDM_CLIENT_ID
      remoteRef:
        key: docsearch/production/abdm/gateway
        property: CLIENT_ID
    - secretKey: ABDM_CLIENT_SECRET
      remoteRef:
        key: docsearch/production/abdm/gateway
        property: CLIENT_SECRET
---
# ------------------------------------------------------------------------------
# 2. Local Fallback / Staging Kubernetes Secret Template (Opaque)
# Note: Values are populated dynamically by ESO in production environments
# ------------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: docsearch-api-gateway-secrets
  namespace: docsearch-production
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: docsearch
type: Opaque
stringData:
  DATABASE_URL: "postgresql://docsearch_admin:REPLACE_WITH_VAULT_PW@docsearch-production-primary.rds.amazonaws.com:5432/docsearch?sslmode=require"
  REDIS_URL: "rediss://docsearch-production-cache.elasticache.ap-south-1.amazonaws.com:6379"
  JWT_SECRET: "REPLACE_WITH_MINIMUM_32_CHARACTERS_CRYPTOGRAPHIC_JWT_KEY_PROD"
  ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  RAZORPAY_KEY_ID: "REPLACE_WITH_LIVE_RAZORPAY_KEY_ID"
  RAZORPAY_KEY_SECRET: "REPLACE_WITH_LIVE_RAZORPAY_KEY_SECRET"
  RAZORPAY_WEBHOOK_SECRET: "REPLACE_WITH_LIVE_RAZORPAY_WEBHOOK_SECRET"
  ABDM_CLIENT_ID: "REPLACE_WITH_LIVE_NHA_ABDM_CLIENT_ID"
  ABDM_CLIENT_SECRET: "REPLACE_WITH_LIVE_NHA_ABDM_CLIENT_SECRET"
