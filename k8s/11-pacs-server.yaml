apiVersion: apps/v1
kind: Deployment
metadata:
  name: docsearch-pacs-server
  namespace: docsearch-production
  labels:
    app.kubernetes.io/name: pacs-server
    app.kubernetes.io/part-of: docsearch
    app.kubernetes.io/component: radiology
spec:
  replicas: 2
  strategy:
    type: Recreate # Required when using ReadWriteOnce PVC across pods
  selector:
    matchLabels:
      app.kubernetes.io/name: pacs-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pacs-server
        app.kubernetes.io/part-of: docsearch
        app.kubernetes.io/component: radiology
    spec:
      serviceAccountName: docsearch-pacs-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pacs-server
          image: docsearch/pacs-server:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http-pacs
              containerPort: 8042
              protocol: TCP
            - name: dicom-dimse
              containerPort: 11112
              protocol: TCP
          envFrom:
            - configMapRef:
                name: docsearch-pacs-config
          startupProbe:
            httpGet:
              path: /health
              port: http-pacs
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: http-pacs
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http-pacs
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          volumeMounts:
            - name: pacs-data
              mountPath: /app/data/pacs-storage
      volumes:
        - name: pacs-data
          persistentVolumeClaim:
            claimName: docsearch-pacs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: docsearch-pacs-svc
  namespace: docsearch-production
  labels:
    app.kubernetes.io/name: pacs-server
    app.kubernetes.io/part-of: docsearch
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pacs-server
  ports:
    - name: http-pacs
      port: 8042
      targetPort: http-pacs
      protocol: TCP
    - name: dicom-dimse
      port: 11112
      targetPort: dicom-dimse
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: docsearch-pacs-pdb
  namespace: docsearch-production
  labels:
    app.kubernetes.io/name: pacs-server
    app.kubernetes.io/part-of: docsearch
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pacs-server
