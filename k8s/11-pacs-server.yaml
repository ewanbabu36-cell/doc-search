# ==============================================================================
# DocSearch Radiology PACS Server Workload Specification
# ==============================================================================
# ARCHITECTURAL DECISION (Phase 7.1B):
# Configured as Active-Passive Single Replica (replicas: 1) with Recreate strategy.
# - Justification: The native PACS server daemon (scripts/docsearch-pacs-server.mjs)
#   maintains a local metadata file index (pacs-index.json) on disk. Multiple concurrent
#   pods sharing a ReadWriteOnce (RWO) AWS EBS volume causes Multi-Attach deadlocks
#   across nodes and corrupts pacs-index.json via uncoordinated file writes.
# - High Availability: Automated node-failure recovery is managed by Kubernetes:
#   if the host node fails, the pod is automatically rescheduled onto an available node
#   and re-attaches the persistent EBS volume.
# - Multi-Replica Cloud Roadmap: For future horizontal multi-pod scaling, the study
#   index will be migrated to the PostgreSQL cluster and raw DICOM blobs to Amazon S3.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docsearch-pacs-server
  namespace: docsearch-production
  labels:
    app.kubernetes.io/name: pacs-server
    app.kubernetes.io/part-of: docsearch
    app.kubernetes.io/component: radiology
spec:
  replicas: 1
  strategy:
    type: Recreate # Clean volume detach/reattach on pod rescheduling
  selector:
    matchLabels:
      app.kubernetes.io/name: pacs-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pacs-server
        app.kubernetes.io/part-of: docsearch
        app.kubernetes.io/component: radiology
    spec:
      serviceAccountName: docsearch-pacs-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pacs-server
          image: docsearch/pacs-server:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http-pacs
              containerPort: 8042
              protocol: TCP
            - name: dicom-dimse
              containerPort: 11112
              protocol: TCP
          envFrom:
            - configMapRef:
                name: docsearch-pacs-config
          startupProbe:
            httpGet:
              path: /health
              port: http-pacs
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: http-pacs
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http-pacs
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          volumeMounts:
            - name: pacs-data
              mountPath: /app/data/pacs-storage
      volumes:
        - name: pacs-data
          persistentVolumeClaim:
            claimName: docsearch-pacs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: docsearch-pacs-svc
  namespace: docsearch-production
  labels:
    app.kubernetes.io/name: pacs-server
    app.kubernetes.io/part-of: docsearch
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pacs-server
  ports:
    - name: http-pacs
      port: 8042
      targetPort: http-pacs
      protocol: TCP
    - name: dicom-dimse
      port: 11112
      targetPort: dicom-dimse
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: docsearch-pacs-pdb
  namespace: docsearch-production
  labels:
    app.kubernetes.io/name: pacs-server
    app.kubernetes.io/part-of: docsearch
spec:
  maxUnavailable: 1 # Allows node drain while honoring single-replica workload
  selector:
    matchLabels:
      app.kubernetes.io/name: pacs-server
