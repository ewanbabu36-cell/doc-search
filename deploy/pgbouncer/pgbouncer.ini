;; ==============================================================================
;; DocSearch Enterprise Healthcare SaaS — PgBouncer Configuration
;; Production Connection Pooling & Concurrency Hardening
;; ==============================================================================

[databases]
docsearch = host=127.0.0.1 port=5432 dbname=docsearch auth_user=postgres
docsearch_ro = host=127.0.0.1 port=5432 dbname=docsearch auth_user=postgres

[pgbouncer]
;; Administrative settings
logfile = /var/log/postgresql/pgbouncer.log
pidfile = /var/run/postgresql/pgbouncer.pid

;; Connection settings
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename=$1

;; Pool configuration
;; Transaction pooling mode is used for maximum concurrency.
;; Transaction-local session variables (SET LOCAL / set_config is_local=true)
;; are strictly scoped to the active transaction and reset on COMMIT/ROLLBACK.
pool_mode = transaction

;; Connection limits
max_client_conn = 1000
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 5
max_db_connections = 60
max_user_connections = 40

;; Timeouts and keepalives
server_idle_timeout = 300
server_connect_timeout = 15
server_login_retry = 1
query_timeout = 60
query_wait_timeout = 30
client_idle_timeout = 0
client_login_timeout = 60
idle_transaction_timeout = 30

;; Health checks and keepalive
server_check_delay = 30
server_check_query = SELECT 1
server_fast_close = 0

;; Low-level network tuning
pkt_buf = 4096
max_packet_size = 2147483647
tcp_defer_accept = 1
tcp_socket_buffer = 0
tcp_keepalive = 1
tcp_keepcnt = 3
tcp_keepidle = 60
tcp_keepintvl = 10

;; Logging & Monitoring
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60
verbose = 0
