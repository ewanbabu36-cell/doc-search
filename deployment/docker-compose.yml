version: '3.8'

services:
  docsearch-api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    container_name: docsearch-api-gateway
    restart: always
    environment:
      - PORT=4000
      - NODE_ENV=production
    ports:
      - "4000:4000"

  docsearch-web:
    image: nginx:alpine
    container_name: docsearch-nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../apps/landing-page/dist:/var/www/landing-page/dist:ro
      - ../apps/partner-platform/dist:/var/www/partner-platform/dist:ro
      - ../apps/company-platform/dist:/var/www/company-platform/dist:ro
    depends_on:
      - docsearch-api
