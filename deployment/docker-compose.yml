version: '3.8'

services:
  docsearch-api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    container_name: docsearch-api-gateway
    restart: always
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres_secure_pass_2026@postgres:5432/docsearch}
      - JWT_SECRET=${JWT_SECRET:-production_super_strong_cryptographic_key_min_32_characters}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    ports:
      - "4000:4000"

  docsearch-web:
    image: nginx:alpine
    container_name: docsearch-nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../apps/landing-page/dist/bundle:/var/www/landing-page/dist/bundle:ro
      - ../apps/partner-platform/dist/bundle:/var/www/partner-platform/dist/bundle:ro
      - ../apps/company-platform/dist/bundle:/var/www/company-platform/dist/bundle:ro
    depends_on:
      - docsearch-api
