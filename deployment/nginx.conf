# DocSearch Single-Domain Nginx Production Reverse Proxy Configuration
# Domain: docsearch.in (or your custom domain)

server {
    listen 80;
    server_name docsearch.in www.docsearch.in localhost;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # 1. Main Root Domain: Public Landing Page & Patient Discovery
    location / {
        root /var/www/landing-page/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. Path /partner: Hospital Partner & Doctor EMR Platform
    location /partner/ {
        alias /var/www/partner-platform/dist/;
        index index.html;
        try_files $uri $uri/ /partner/index.html;
    }

    # 3. Path /hq: Company Platform SaaS HQ & Founder Control Tower
    location /hq/ {
        alias /var/www/company-platform/dist/;
        index index.html;
        try_files $uri $uri/ /hq/index.html;
    }

    # 4. Path /api: Backend REST & WebSocket Microservices API Gateway
    location /api/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
