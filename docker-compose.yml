services:
  # ----------------------------------------------------------------------------
  # 1. Database Layer (PostgreSQL 16 with Row-Level Security)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: docsearch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-docsearch}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-docsearch}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Caching & Session Storage Layer (Redis 7)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: docsearch-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # 3. Backend API Gateway Microservice
  # ----------------------------------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.api-gateway
    container_name: docsearch-api-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-docsearch}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-production_super_strong_cryptographic_key_min_32_characters}
      JWT_ISSUER: docsearch-api
      JWT_AUDIENCE: docsearch-platform
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      LOG_LEVEL: info
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 4. Radiology PACS Server (DICOM C-STORE Port 11112 & DICOMweb Port 8042)
  # ----------------------------------------------------------------------------
  pacs-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.pacs-server
    container_name: docsearch-pacs-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PACS_DICOM_PORT: 11112
      PACS_HTTP_PORT: 8042
      PACS_AE_TITLE: DOCSEARCH_PACS
    ports:
      - "8042:8042"
      - "11112:11112"
    volumes:
      - pacs_storage:/app/data/pacs-storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8042/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 5. Partner Platform Frontend (Hospital Operations & Clinical EMR)
  # ----------------------------------------------------------------------------
  partner-platform:
    build:
      context: .
      dockerfile: docker/Dockerfile.web-app
      args:
        APP_NAME: partner-platform
    container_name: docsearch-partner-platform
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      api-gateway:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 6. Patient Mobile App (Aarogya360 PWA & Health Locker)
  # ----------------------------------------------------------------------------
  patient-app:
    build:
      context: .
      dockerfile: docker/Dockerfile.web-app
      args:
        APP_NAME: patient-app
    container_name: docsearch-patient-app
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      api-gateway:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 7. Company Platform Frontend (HQ Governance & SuperAdmin Tower)
  # ----------------------------------------------------------------------------
  company-platform:
    build:
      context: .
      dockerfile: docker/Dockerfile.web-app
      args:
        APP_NAME: company-platform
    container_name: docsearch-company-platform
    restart: unless-stopped
    ports:
      - "5177:80"
    depends_on:
      api-gateway:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 8. Marketing & Patient Discovery Landing Page Frontend
  # ----------------------------------------------------------------------------
  landing-page:
    build:
      context: .
      dockerfile: docker/Dockerfile.web-app
      args:
        APP_NAME: landing-page
    container_name: docsearch-landing-page
    restart: unless-stopped
    ports:
      - "5175:80"

  # ----------------------------------------------------------------------------
  # 9. Unified Production NGINX Reverse Proxy Ingress Gateway
  # ----------------------------------------------------------------------------
  nginx-ingress:
    build:
      context: .
      dockerfile: docker/Dockerfile.nginx-ingress
    container_name: docsearch-nginx-ingress
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api-gateway
      - pacs-server
      - partner-platform
      - patient-app
      - company-platform
      - landing-page
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 15s
      timeout: 3s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pacs_storage:
    driver: local
