services:
  # ----------------------------------------------------------------------------
  # Database Layer (PostgreSQL 16 with RLS)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: docsearch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-docsearch}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-docsearch}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Caching & Session Storage Layer (Redis 7)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: docsearch-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # Backend API Gateway Service
  # ----------------------------------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.api-gateway
    container_name: docsearch-api-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-docsearch}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-docsearch_master_jwt_secret_dev_32char_key_only}
      JWT_ISSUER: docsearch-api
      JWT_AUDIENCE: docsearch-platform
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # Partner Platform Frontend (Hospital Operations & Clinical Portal)
  # ----------------------------------------------------------------------------
  partner-platform:
    build:
      context: .
      dockerfile: docker/Dockerfile.web-app
      args:
        APP_NAME: partner-platform
    container_name: docsearch-partner-platform
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      api-gateway:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Company Platform Frontend (HQ Governance, Multi-Tenant Management)
  # ----------------------------------------------------------------------------
  company-platform:
    build:
      context: .
      dockerfile: docker/Dockerfile.web-app
      args:
        APP_NAME: company-platform
    container_name: docsearch-company-platform
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      api-gateway:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Marketing Landing Page Frontend
  # ----------------------------------------------------------------------------
  landing-page:
    build:
      context: .
      dockerfile: docker/Dockerfile.web-app
      args:
        APP_NAME: landing-page
    container_name: docsearch-landing-page
    restart: unless-stopped
    ports:
      - "5175:80"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
