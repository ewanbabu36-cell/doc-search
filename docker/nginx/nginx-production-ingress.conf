# ==============================================================================
# DocSearch Master Production Ingress Reverse Proxy Configuration
# Hardened with HTTPS Port 443, TLS 1.2/1.3, Strict HSTS, and ACME Pass-Through
# ==============================================================================
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main_timed '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for" '
                          'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main_timed;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 128M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml font/woff2;

    # Upstream Microservices
    upstream api_gateway_upstream {
        server api-gateway:4000;
        keepalive 64;
    }

    upstream pacs_upstream {
        server pacs-server:8042;
        keepalive 32;
    }

    upstream partner_platform_upstream {
        server partner-platform:80;
        keepalive 32;
    }

    upstream patient_app_upstream {
        server patient-app:80;
        keepalive 32;
    }

    upstream company_platform_upstream {
        server company-platform:80;
        keepalive 32;
    }

    upstream landing_page_upstream {
        server landing-page:80;
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # 1. HTTP Port 80 Listener (ACME Challenge, Healthcheck, & HTTPS Redirection)
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Healthcheck endpoint (Unencrypted internal Docker healthchecks)
        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'docsearch-ingress-healthy\n';
        }

        # ACME Let's Encrypt HTTP-01 Webroot Challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Enforce HTTP to HTTPS Redirect for all other traffic
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # 2. HTTPS Port 443 Listener (Production TLS 1.2 & 1.3 Termination)
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        # SSL Certificates
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # TLS Protocols & Cipher Suites (Strict TLS 1.2 & TLS 1.3)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
        ssl_prefer_server_ciphers on;

        # SSL Session Cache & Optimization
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Enterprise Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Healthcheck endpoint over HTTPS
        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'docsearch-ingress-tls-healthy\n';
        }

        # 1. API Gateway REST & Real-Time WebSockets
        location /api/ {
            proxy_pass http://api_gateway_upstream/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
            proxy_connect_timeout 15s;
        }

        # 2. Radiology PACS DICOMweb REST Streaming
        location /pacs/ {
            proxy_pass http://pacs_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
        }

        # 3. Hospital Partner Platform (Operations & Doctor Clinical Suite)
        location /partner/ {
            proxy_pass http://partner_platform_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # 4. Aarogya360 Patient Mobile Web Application (PWA)
        location /patient/ {
            proxy_pass http://patient_app_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # 5. Company Platform (SuperAdmin HQ Governance)
        location /hq/ {
            proxy_pass http://company_platform_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # 6. Default Root: Public Marketing & Patient Discovery Portal
        location / {
            proxy_pass http://landing_page_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
