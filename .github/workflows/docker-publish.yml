name: Docker Build & Security Vulnerability Scan

on:
  push:
    branches: [ main, release/* ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-scan:
    name: Build & Scan Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      matrix:
        include:
          - image: api-gateway
            dockerfile: docker/Dockerfile.api-gateway
            build-args: ""
          - image: partner-platform
            dockerfile: docker/Dockerfile.web-app
            build-args: "APP_NAME=partner-platform"
          - image: company-platform
            dockerfile: docker/Dockerfile.web-app
            build-args: "APP_NAME=company-platform"
          - image: landing-page
            dockerfile: docker/Dockerfile.web-app
            build-args: "APP_NAME=landing-page"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU for Multi-Architecture Builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          push: false
          tags: docsearch/${{ matrix.image }}:${{ github.sha }}
          load: true

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: docsearch/${{ matrix.image }}:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
