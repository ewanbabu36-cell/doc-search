name: DocSearch Production Cloud Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test-and-verify:
    name: 🧪 Automated Quality & Deployment Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.4

      - name: Get pnpm Store Directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm Cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Production Docker & Mobile Topologies
        run: node scripts/verify-docker-production.mjs

  deploy-to-vps:
    name: 🚀 Rollout to Production Cloud Server
    needs: [test-and-verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy via SSH to Production Host
        uses: appleboy/ssh-action@v1.0.3
        if: env.PROD_HOST != ''
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER || 'root' }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "=========================================================="
            echo "🚀 PULLING LATEST DOCSEARCH RELEASE ON HOST: $(hostname)"
            echo "=========================================================="
            cd /opt/docsearch || (git clone https://github.com/ewanbabu36-cell/doc-search.git /opt/docsearch && cd /opt/docsearch)
            git fetch origin main
            git reset --hard origin/main
            chmod +x deploy/*.sh
            ./deploy/deploy-production.sh
