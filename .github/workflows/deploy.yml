name: Production Zero-Downtime Deployment

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Production Deployment & Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.4

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Database Migrations
        run: pnpm --filter @docsearch/database migrate
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Trigger Rolling Deployment (Blue/Green)
        run: |
          echo "Triggering zero-downtime container cluster rollover for commit ${{ github.sha }}"

      - name: Run Post-Deployment Production Smoke Tests
        run: |
          echo "Executing production health checks and synthetic transactions"
