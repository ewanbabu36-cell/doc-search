name: Continuous Integration (CI)

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Code Quality & Security Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.4
          run_install: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm exec eslint . --max-warnings=0

      - name: Run TypeScript Typecheck
        run: pnpm -r typecheck

      - name: Run Automated Test Suites
        run: pnpm test
        env:
          NODE_ENV: test
          JWT_SECRET: docsearch_master_jwt_secret_dev_32char_key_only
          JWT_ISSUER: docsearch-api
          JWT_AUDIENCE: docsearch-platform
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/docsearch

      - name: Run Production Monorepo Build
        run: pnpm -r build
